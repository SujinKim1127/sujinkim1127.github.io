## => Site Settings
##############################
text_skin: green # custom green skin (_sass/skins/_green.scss)
highlight_theme: default
url: https://sujinkim1127.github.io
baseurl:
title: ★•. BE HAPPY ★°*ﾟ
description: >
  개발하며 배운 것들을 기록하는 기술 블로그

## => Language and Timezone
##############################
lang: ko
timezone: Asia/Seoul

## => Author and Social
##############################
author:
  type: person
  name: sujinkim1127
  bio: 프론트엔드 개발자
  github: sujinkim1127

## => GitHub Repository
##############################
repository: sujinkim1127/sujinkim1127.github.io
repository_tree: main

## => Paths
##############################
paths:
  root:
  home:
  archive: /archive.html
  rss: /feed.xml

## => Post
##############################
excerpt_separator: <!--more-->
license: false

toc:
  selectors:

## => Markdown Enhancements
##############################
mathjax: false
mathjax_autoNumber: false
mermaid: true
chart: true

## => Paginate
##############################
paginate: 8
paginate_path: /page:num

## => Sharing / Comments / Pageview / Search / Analytics
##############################
sharing:
  provider: false

comments:
  provider: false

pageview:
  provider: false

search:
  provider: default

analytics:
  provider: false

## => Build
##############################
markdown: kramdown
highlighter: rouge
permalink: date
theme: jekyll-text-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: true
      aside:
        toc: true
      show_edit_on_github: false
      show_subscribe: false
      pageview: false

## => Plugins
##############################
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
